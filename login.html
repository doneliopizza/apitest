
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Light POS - Iniciar sesión</title>

    <!-- Variables de color / tipografía viven en ventas.css -->
    <link
        rel="stylesheet"
        href="pages/ventas/ventas.css"
    >

    <link
        rel="stylesheet"
        href="css/login.css"
    >

</head>


<body>

    <div class="login-page">

        <div class="login-card">

            <div class="login-logo">

                <div class="logo-icon">
                    LP
                </div>

                <div>

                    <strong>
                        Light POS
                    </strong>

                    <span>
                        Sistema de gestión
                    </span>

                </div>

            </div>


            <div class="login-header">

                <h1>
                    Iniciar sesión
                </h1>

                <p>
                    Ingresá tus credenciales para continuar.
                </p>

            </div>


            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        id="email"
                        type="email"
                        class="form-control"
                        placeholder="usuario@empresa.com"
                        autocomplete="username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        id="password"
                        type="password"
                        class="form-control"
                        placeholder="Contraseña"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <div
                    id="loginError"
                    class="login-error hidden"
                ></div>


                <button
                    id="btnLogin"
                    type="submit"
                    class="btn btn-primary login-button"
                >
                    Ingresar
                </button>

            </form>


            <div class="login-footer">
                Light POS
            </div>

        </div>

    </div>


    <!-- =====================================================
         CONFIGURACIÓN API
    ====================================================== -->

    <script src="config.js"></script>


    <!-- =====================================================
         LOGIN
    ====================================================== -->

    <script>

        const API_URL = window.LIGHTPOS_API_URL;

        const form =
            document.getElementById(
                "loginForm"
            );


        const error =
            document.getElementById(
                "loginError"
            );


        const boton =
            document.getElementById(
                "btnLogin"
            );


        form.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                error.classList.add(
                    "hidden"
                );


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();


                const password =
                    document
                        .getElementById("password")
                        .value;


                boton.disabled = true;

                boton.textContent =
                    "Ingresando...";


                try {

                    const respuesta =
                        await fetch(
                            `${API_URL}/auth/login`,
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({
                                    email: email,
                                    password: password
                                })
                            }
                        );


                    const texto = await respuesta.text();

                    console.log("RESPUESTA LOGIN:", texto);

                    let datos;

                    try {
                        datos = JSON.parse(texto);
                    } catch (e) {
                        throw new Error(
                            `El servidor no devolvió JSON. HTTP ${respuesta.status}`
                        );
                    }


                    if (!respuesta.ok) {

                        throw new Error(
                            datos.detail ||
                            "No se pudo iniciar sesión."
                        );

                    }


                    /*
                     * Guardamos JWT
                     */

                    localStorage.setItem(
                        "lightpos_token",
                        datos.access_token
                    );


                    /*
                     * Guardamos usuario
                     */

                    if (datos.usuario) {

                        localStorage.setItem(
                            "lightpos_usuario",
                            JSON.stringify(
                                datos.usuario
                            )
                        );

                    }


                    /*
                     * Entramos al POS
                     */

                    window.location.href =
                        "index.html";

                }

                catch (e) {

                    console.error(
                        "Error login:",
                        e
                    );


                    error.textContent =
                        e.message ||
                        "Error al iniciar sesión.";


                    error.classList.remove(
                        "hidden"
                    );

                }

                finally {

                    boton.disabled = false;

                    boton.textContent =
                        "Ingresar";

                }

            }
        );

    </script>

</body>

</html>
